<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departmental Student Information Board</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/images/logo.png" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="announcements.html">Announcements</a></li>
                <li><a href="timetable.html">Timetables</a></li>
                <li><a href="events.html">Events Calendar</a></li>
            </ul>
        </nav>
        <a href="admin-login.html" class="admin-link">Admin Login</a>
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="container">
        <section class="search-filter-bar">
            <input type="text" id="search-input" placeholder="Search announcements, events...">
            <select id="filter-category">
                <option value="">All Updates</option>
                <option value="academic">Academic</option>
                <option value="event">Events</option>
                <option value="general">General</option>
            </select>
            <button onclick="performSearch()">Search</button>
        </section>

        <section class="info-board">
            <h2><i class="fa-solid fa-bullhorn"></i> Latest Announcements</h2>
            <div id="announcements-list" class="card-container">
                <div class="loading-container"><div class="spinner"></div><p>Loading latest announcements...</p></div>
            </div>
            <a href="announcements.html" class="view-all-btn">View All Announcements →</a>

            <hr>

            <h2><i class="fa-regular fa-calendar"></i> Upcoming Events</h2>
            <div id="events-preview" class="event-preview-container">
                <div class="loading-container"><div class="spinner"></div><p>Loading upcoming events...</p></div>
            </div>
            <a href="events.html" class="view-all-btn">View Full Calendar →</a>
        </section>
    </main>

    <footer>
        <p>© <span id="currentYear">2025</span> CIT306 Project | Federal University of Technology, Owerri</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
