<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CIT Information Board</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="admin-body">
    <main class="login-container">
        <div class="login-card">
            <div class="logo-mini">
                <img src="assets/images/logo-mini.png" alt="logo">
            </div>
            <h2>Secure Administrator Access</h2>
            <p class="warning">Only authorized departmental personnel should log in here.</p>
            
            <form id="admin-login-form">
                
                <div id="login-status-message" class="status-message" style="display:none;"></div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" id="login-btn">Log In</button>
                
                <div class="back-link">
                    <a href="index.html">← Back to Student Home</a>
                </div>
            </form>
        </div>
    </main>
    
    <script src="assets/js/main.js"></script> 
    <script src="assets/js/admin.js"></script> 
</body>
</html>
