<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departmental Announcements & Notices</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/images/logo.png" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="announcements.html" class="active">Announcements</a></li>
                <li><a href="timetable.html">Timetables</a></li>
                <li><a href="events.html">Events Calendar</a></li>
            </ul>
        </nav>
        <a href="admin-login.html" class="admin-link">Admin Login</a>
        <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="container">
        <h1>Departmental Notices & Announcements</h1>

        <section class="search-filter-bar">
            <input type="text" id="search-input" placeholder="Search by title or keyword...">
            <select id="filter-category">
                <option value="all">All Categories</option>
                <option value="academic">Academic (Results, Exams)</option>
                <option value="general">General (HOD notices)</option>
                <option value="admin">Administrative</option>
            </select>
            <button onclick="performSearchAndFilter()">Filter Notices</button>
        </section>

        <section id="full-announcement-list" class="full-list-container">
            <div id="loading-message" class="loading-container"><div class="spinner"></div><p>Loading latest announcements...</p></div>
            <p id="no-results" style="display: none; text-align: center;">No announcements match your search criteria.</p>

        </section>
        
        <a href="archive.html" class="view-all-btn archive-link">View Archived Notices →</a>
    </main>

    <footer>
        <p>© <span id="currentYear">2025</span> CIT306 Project | Federal University of Technology, Owerri</p>
    </footer>

    <script src="assets/js/announcements.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
