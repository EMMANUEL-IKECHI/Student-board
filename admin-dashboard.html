<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Post Announcement</title>
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body>
    <header>
        <div class="logo">
            <img src="assets/images/logo.png" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Post Announcement</a></li>
                <li><a href="#">Manage Events</a></li>
                <li><a href="#">View Archive</a></li>
            </ul>
        </nav>
        <button class="logout-btn">Logout</button>
    </header>

    <main class="container">
        <h1>Post New Departmental Announcement</h1>

        <form id="announcement-form" class="admin-form">
            <div class="form-group">
                <label for="title">Announcement Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    <option value="">-- Select Category --</option>
                    <option value="academic">Academic (Results, Exams)</option>
                    <option value="event">Event (Calendar updates)</option>
                    <option value="general">General (HOD notices, Holidays)</option>
                    <option value="admin">Administrative</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">Content / Full Details:</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>

            <div class="form-group">
                <label for="expiry-date">Optional: Expiry/Archive Date:</label>
                <input type="date" id="expiry-date" name="expiry-date">
                <small>The announcement will automatically move to the archive after this date.</small>
            </div>
            
            <button type="submit" class="submit-btn">Publish Announcement</button>
            <button type="reset" class="reset-btn">Clear Form</button>
        </form>
    </main>

    <footer>
        <p>Admin Interface | FUTO CIT Dept.</p>
    </footer>

    <script src="assets/js/admin.js"></script>
</body>
</html>
